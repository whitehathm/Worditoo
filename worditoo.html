<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23a8f5e7'/%3E%3Cg transform='translate(32,50)'%3E%3Ccircle cx='0' cy='0' r='22' fill='%23ffffff' stroke='%2328193d' stroke-width='7'/%3E%3Ccircle cx='3' cy='-3' r='11' fill='%237cb342' opacity='0.35'/%3E%3Ccircle cx='3' cy='-3' r='9' fill='%2328193d'/%3E%3Ccircle cx='0' cy='-6' r='3.5' fill='%23ffffff'/%3E%3Ccircle cx='6' cy='0' r='1.8' fill='%23ffffff'/%3E%3C/g%3E%3Cg transform='translate(70,50)'%3E%3Ccircle cx='0' cy='0' r='22' fill='%23ffffff' stroke='%2328193d' stroke-width='7'/%3E%3Ccircle cx='3' cy='-3' r='11' fill='%237cb342' opacity='0.35'/%3E%3Ccircle cx='3' cy='-3' r='9' fill='%2328193d'/%3E%3Ccircle cx='0' cy='-6' r='3.5' fill='%23ffffff'/%3E%3Ccircle cx='6' cy='0' r='1.8' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E">
  <title>Worditoo - Visual English Learning Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&display=swap');

    :root {
      --ink: #28193d;
      --bg: #a8f5e7;
      --yellow: #f1c40f;
      --red: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Fredoka', system-ui, sans-serif;
      background-color: var(--bg);
      color: #ffffff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Multi-layered dark stroke text matching BaBaDum exactly */
    .babadum-stroke-text {
      font-weight: 900;
      color: #ffffff;
      text-transform: lowercase;
      letter-spacing: 0.04em;
      text-shadow:
        -3px -3px 0 #28193d,
         3px -3px 0 #28193d,
        -3px  3px 0 #28193d,
         3px  3px 0 #28193d,
         0    5px 0 #28193d,
        -1px  4px 0 #28193d,
         1px  4px 0 #28193d;
      line-height: 1.1;
    }

    /* Screen containers */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    /* Quadrants */
    .quadrant-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: 100vh;
    }

    .quadrant {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      padding: 16px;
      transition: filter 150ms ease;
    }

    .quadrant:active {
      filter: brightness(1.08);
    }

    .quadrant svg {
      width: 65%;
      height: 65%;
      max-width: 250px;
      max-height: 250px;
      filter: drop-shadow(0 8px 0 rgba(40,25,61,0.14));
    }

    /* Smoke cloud burst & sequential reveal styles */
    @keyframes smokeBurstAnim {
      0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
      20% { transform: scale(0.95) rotate(0deg); opacity: 0.95; }
      65% { transform: scale(1.25) rotate(5deg); opacity: 0.85; }
      100% { transform: scale(1.5) rotate(10deg); opacity: 0; }
    }

    .smoke-cloud-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 40;
    }

    .smoke-cloud-burst {
      width: min(290px, 68vw);
      height: min(290px, 68vw);
      animation: smokeBurstAnim 0.52s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      transform-origin: center center;
      filter: drop-shadow(0 8px 0 rgba(40, 25, 61, 0.22));
    }

    @keyframes itemPopInAnim {
      0% { transform: scale(0.15); opacity: 0; }
      60% { transform: scale(1.12); opacity: 1; }
      85% { transform: scale(0.96); opacity: 1; }
      100% { transform: scale(1.0); opacity: 1; }
    }

    .item-reveal-active {
      animation: itemPopInAnim 0.44s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transform-origin: center center;
    }

    @keyframes centerWordRevealAnim {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      75% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }
    }

    .center-word-reveal {
      animation: centerWordRevealAnim 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Center text overlay for Mode 1 */
    .center-word {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 50;
      font-size: clamp(2rem, 6vw, 4.5rem);
      text-align: center;
    }

    /* Mode 2: Center Image + 4 Word Options */
    .mode2-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 70px 16px 20px;
    }

    .mode2-words {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      flex: 1;
      gap: 12px;
      max-width: 800px;
    }

    .word-card {
      border: 4px solid var(--ink);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      cursor: pointer;
      padding: 12px;
      text-align: center;
      transition: transform 100ms ease;
    }

    .word-card:active {
      transform: translateY(3px);
    }

    .word-card.struck {
      text-decoration: line-through !important;
      text-decoration-color: #e74c3c !important;
      opacity: 0.45;
      pointer-events: none;
    }

    /* Mode 4 Letter Builder */
    .mode4-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 70px 16px 30px;
    }

    .letter-slot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px dashed var(--ink);
      background: rgba(40,25,61,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.7rem;
    }

    .letter-slot.filled {
      background: var(--yellow);
      border: 3.5px solid var(--ink);
      box-shadow: 0 4px 0 var(--ink);
    }

    .letter-bubble {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3.5px solid var(--ink);
      background: #ffffff;
      color: var(--ink);
      font-size: 1.6rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 100ms ease;
    }

    .letter-bubble:active {
      transform: translateY(2px);
    }

    .letter-bubble.used {
      opacity: 0.15;
      pointer-events: none;
    }

    /* HUD Header */
    .hud-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      pointer-events: none;
    }

    .hud-left, .hud-right, .hud-center {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mode-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--yellow);
      border: 3.5px solid var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mode-dropdown {
      position: absolute;
      top: 64px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
    }

    .mode-dropdown-item {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid var(--ink);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--ink);
    }

    .mode-dropdown-item.active {
      background: var(--yellow);
    }

    /* Sliding Thumbs */
    .thumb-feedback {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 140px;
      height: 140px;
      z-index: 300;
      pointer-events: none;
      transition: transform 400ms cubic-bezier(0.19, 1, 0.22, 1), opacity 300ms ease;
      filter: drop-shadow(0 10px 0 rgba(40,25,61,0.25));
    }

    .thumb-up {
      left: 20px;
      transform: translateY(-50%) translateX(-160%);
      opacity: 0;
    }

    .thumb-up.show {
      transform: translateY(-50%) translateX(0);
      opacity: 1;
    }

    .thumb-down {
      right: 20px;
      transform: translateY(-50%) translateX(160%);
      opacity: 0;
    }

    .thumb-down.show {
      transform: translateY(-50%) translateX(0);
      opacity: 1;
    }

    /* Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(40,25,61,0.65);
      backdrop-filter: blur(4px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      background: #faf7ed;
      border: 4px solid var(--ink);
      border-radius: 24px;
      box-shadow: 0 12px 0 var(--ink);
      width: 100%;
      max-width: 580px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink);
    }

    .btn-pill {
      background: #733c1f;
      color: #ffe6aa;
      border: 3px solid #361b0c;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #361b0c;
    }

    .btn-pill:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <!-- ==========================================
       1. LANDING SCREEN
       ========================================== -->

        <g id="letters-oo-eyes">
          <path d="M 405,28 Q 420,19 435,27" stroke="#28193d" stroke-width="6" stroke-linecap="round" fill="none"/>
          <path d="M 465,24 Q 480,18 495,29" stroke="#28193d" stroke-width="6" stroke-linecap="round" fill="none"/>

          <g transform="translate(422, 73)">
            <circle cx="0" cy="0" r="27" fill="#ffffff" stroke="#28193d" stroke-width="9"/>

          <!-- Right Eye -->
          <g transform="translate(480, 73)">
            <circle cx="0" cy="0" r="27" fill="#ffffff" stroke="#28193d" stroke-width="9"/>
            <circle cx="3" cy="-3" r="13" fill="#7cb342" opacity="0.4"/>
            <circle cx="3" cy="-3" r="11" fill="#28193d"/>

        </g>
      </svg>
    </div>

    <h2 style="font-size: 1.8rem; font-weight: 900; text-shadow: 0 3px 0 #28193d; margin-bottom: 4px;">Play and learn</h2>
    <p style="font-weight: 700; color: #28193d; opacity: 0.85; margin-bottom: 24px;">500 words, English language, 5 games</p>

    <div style="display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; justify-content: center;">
      <button class="btn-pill" onclick="audioSys.playClick(); openModal('explorer')">Explorer</button>
      <button class="btn-pill" onclick="audioSys.playClick(); openModal('scores')">High scores</button>
      <button class="btn-pill" onclick="audioSys.playClick(); openModal('stats')">Statistics</button>
    </div>

    <button onclick="startGame()" class="babadum-stroke-text" style="background: var(--yellow); border: 4px solid var(--ink); border-radius: 999px; padding: 12px 64px; font-size: 2.4rem; box-shadow: 0 8px 0 var(--ink); cursor: pointer;">
      Play
    </button>
  </div>

  <!-- ==========================================
       2. GAMEPLAY SCREEN & HUD
       ========================================== -->
  <div id="gameScreen" class="screen hidden">
    <!-- HUD Header -->
    <header class="hud-header">
      <div class="hud-left">
        <!-- Compact Mode Selector Trigger -->
        <button id="modeBtn" class="mode-badge" onclick="audioSys.playClick(); toggleModeDropdown()">
          <div id="modeIconSlot" style="width: 28px; height: 28px;"></div>
        </button>
        <!-- Compact Dropdown Stack (Directly below) -->
        <div id="modeDropdown" class="mode-dropdown hidden"></div>
      </div>

      <!-- Center Logo -->
      <div class="hud-center" style="cursor: pointer;" onclick="toLanding()">
        <span class="babadum-stroke-text" style="font-size: 1.8rem;">worditoo</span>
      </div>

      <div class="hud-right">
        <!-- Accent toggle: US flag -->

      ['#7a85b8', '#a2c668', '#e8dc88', '#84d8cc'],

      ['#f7ee82', '#a8f5e7', '#f2c0d7', '#81bd47']
    ];

    // Audio & Speech Synthesis Engine
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.currentAudio = null;
        this.cachedVoices = [];
        if ('speechSynthesis' in window) {
          this.cachedVoices = window.speechSynthesis.getVoices();
          window.speechSynthesis.onvoiceschanged = () => {
            this.cachedVoices = window.speechSynthesis.getVoices();
          };
        }
      }
      initCtx() {
        if (!this.ctx && window.AudioContext) {
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        if ('speechSynthesis' in window && this.cachedVoices.length === 0) {
          this.cachedVoices = window.speechSynthesis.getVoices();
        }
      }
      playCorrect() {
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const g1 = this.ctx.createGain();
        osc1.frequency.setValueAtTime(783.99, now);
        g1.gain.setValueAtTime(0.35, now);
        g1.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc1.connect(g1); g1.connect(this.ctx.destination);
        osc1.start(now); osc1.stop(now + 0.22);

        const osc2 = this.ctx.createOscillator();
        const g2 = this.ctx.createGain();
        osc2.frequency.setValueAtTime(1046.50, now + 0.08);
        g2.gain.setValueAtTime(0.4, now + 0.08);
        g2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc2.connect(g2); g2.connect(this.ctx.destination);
        osc2.start(now + 0.08); osc2.stop(now + 0.45);
      }
      playWrong() {
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.28);
        g.gain.setValueAtTime(0.3, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.3);
      }
      playPop(freq = 440) {
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.08);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      }
      playRevealStep(step) {
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.50];
        const target = freqs[step - 1] || 523.25;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(target, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.32, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.35);

        const popOsc = this.ctx.createOscillator();
        const popGain = this.ctx.createGain();
        popOsc.type = 'triangle';
        popOsc.frequency.setValueAtTime(target * 1.6, now);
        popOsc.frequency.exponentialRampToValueAtTime(target * 0.7, now + 0.045);
        popGain.gain.setValueAtTime(0.25, now);
        popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        popOsc.connect(popGain); popGain.connect(this.ctx.destination);
        popOsc.start(now); popOsc.stop(now + 0.05);
      }
      playSmokePop() {
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.start(now); osc.stop(now + 0.28);
      }
      playClick() {
        this.playPop(520);
      }
      pronounce(wordObj) {
        const clean = wordObj.word.trim();
        const isMulti = clean.includes(' ');

        if (this.currentAudio) {
          this.currentAudio.pause();
          this.currentAudio = null;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }

        // For multi-words and words without studio audio, speak full phrase immediately through SpeechSynthesis
        if (isMulti || !wordObj.audioUs) {
          this.speak(clean);
          return;
        }

        const audio = new Audio(wordObj.audioUs);
        this.currentAudio = audio;
        const timeout = setTimeout(() => {
          if (this.currentAudio === audio) {
            this.currentAudio.pause();
            this.currentAudio = null;
            this.speak(clean);

        audio.onended = () => {
          clearTimeout(timeout);
          this.currentAudio = null;
        };

        audio.onerror = () => {
          clearTimeout(timeout);
          this.currentAudio = null;
          this.speak(clean);
        };

        audio.play().catch(() => {
          clearTimeout(timeout);
          this.speak(clean);
        });
      }
      speak(text) {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        } catch(e){}
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.90;
        utter.pitch = 1.0;
        const voices = this.cachedVoices.length > 0 ? this.cachedVoices : window.speechSynthesis.getVoices();
        const priority = ['google us english', 'samantha', 'alex', 'natural', 'karen', 'victoria'];
        let match = null;
        for (const p of priority) {
          match = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(p));
          if (match) break;
        }
        if (!match) match = voices.find(v => v.lang.startsWith('en'));
        if (match) utter.voice = match;
        window.speechSynthesis.speak(utter);
      }
    }

    const audioSys = new AudioEngine();

    // App State
    let currentMode = 1;
    let score = 0;
    let currentWord = null;
    let roundOptions = [];
    let currentColors = PALETTES[0];
    let isLocked = false;
    let spellingSlots = [];
    let spellingTiles = [];

    function init() {
      renderModeDropdown();
      updateModeIcon();
    }

    function toggleModeDropdown() {
      const dd = document.getElementById('modeDropdown');
      dd.classList.toggle('hidden');
    }

    function renderModeDropdown() {
      const dd = document.getElementById('modeDropdown');
      dd.innerHTML = [1, 2, 3, 4, 5].map(m => `
        <div class="mode-dropdown-item ${m === currentMode ? 'active' : ''}" onclick="selectMode(${m})">
          <div style="width: 24px; height: 24px;">${MODE_ICONS[m]}</div>
        </div>
      `).join('');
    }

    function selectMode(m) {
      currentMode = m;
      document.getElementById('modeDropdown').classList.add('hidden');
      renderModeDropdown();
      updateModeIcon();
      loadQuestion();
    }

    function updateModeIcon() {
      document.getElementById('modeIconSlot').innerHTML = MODE_ICONS[currentMode];
    }

    function startGame() {
      document.getElementById('landingScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      score = 0;
      document.getElementById('scoreCounter').innerText = '0';
      loadQuestion();
    }

    function toLanding() {
      audioSys.playClick();
      document.getElementById('landingScreen').classList.remove('hidden');
      document.getElementById('gameScreen').classList.add('hidden');
    }

    const SMOKE_SVG_HTML = `<div class="smoke-cloud-container"><div class="smoke-cloud-burst"><svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><path d="M 120 28 C 146 26, 170 42, 178 66 C 200 70, 216 90, 214 114 C 216 138, 198 158, 178 164 C 172 188, 148 208, 122 210 C 96 212, 72 194, 64 168 C 42 164, 26 142, 28 118 C 26 94, 42 74, 64 68 C 72 44, 96 30, 120 28 Z" fill="#f5e1f0" stroke="#28193d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 120 74 C 142 74, 158 90, 158 114 C 158 138, 140 156, 118 156 C 96 156, 80 138, 82 114 C 82 90, 98 74, 120 74 Z" fill="none" stroke="#28193d" stroke-width="4" stroke-dasharray="14 10" opacity="0.35"/><path d="M 142 46 C 150 56, 158 62, 164 64 M 148 52 C 154 60, 160 64, 166 68" stroke="#28193d" stroke-width="3" stroke-linecap="round"/><path d="M 188 96 C 196 106, 198 116, 198 126 M 182 104 C 190 112, 192 122, 192 130" stroke="#28193d" stroke-width="3" stroke-linecap="round"/><path d="M 156 180 C 146 188, 134 194, 120 196 M 150 174 C 142 182, 132 188, 118 190" stroke="#28193d" stroke-width="3" stroke-linecap="round"/><path d="M 50 144 C 44 134, 44 122, 46 112 M 56 148 C 50 138, 50 126, 52 118" stroke="#28193d" stroke-width="3" stroke-linecap="round"/><path d="M 78 54 C 70 64, 66 74, 66 84 M 84 58 C 76 68, 72 78, 72 88" stroke="#28193d" stroke-width="3" stroke-linecap="round"/><circle cx="220" cy="72" r="10" fill="#f5e1f0" stroke="#28193d" stroke-width="4"/><circle cx="206" cy="52" r="6" fill="#f5e1f0" stroke="#28193d" stroke-width="3.5"/><circle cx="32" cy="64" r="9" fill="#f5e1f0" stroke="#28193d" stroke-width="4"/><circle cx="22" cy="164" r="8" fill="#f5e1f0" stroke="#28193d" stroke-width="3.5"/><circle cx="186" cy="202" r="9" fill="#f5e1f0" stroke="#28193d" stroke-width="4"/></svg></div></div>`;

    let revealTimers = [];

    function loadQuestion() {
      // Clear previous reveal timers
      revealTimers.forEach(t => clearTimeout(t));
      revealTimers = [];

      isLocked = true;
      hideThumbs();

      const effective = currentMode === 5 ? Math.floor(Math.random() * 4) + 1 : currentMode;
      currentWord = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];

      const distractors = VOCABULARY.filter(w => w.id !== currentWord.id).sort(() => 0.5 - Math.random());
      roundOptions = [currentWord, distractors[0], distractors[1], distractors[2]].sort(() => 0.5 - Math.random());
      currentColors = [...PALETTES[Math.floor(Math.random() * PALETTES.length)]].sort(() => 0.5 - Math.random());

      // Hide all stages initially
      document.getElementById('stageQuadrant').classList.add('hidden');
      document.getElementById('stageMode2').classList.add('hidden');
      document.getElementById('stageMode4').classList.add('hidden');

      if (effective === 1 || effective === 3) {
        document.getElementById('stageQuadrant').classList.remove('hidden');
        
        // Reset 4 quadrants to background only
        for (let i = 0; i < 4; i++) {
          const qEl = document.getElementById('q' + i);
          qEl.style.backgroundColor = currentColors[i];
          qEl.innerHTML = '';
        }

        const centerText = document.getElementById('centerWordText');
        const centerAudio = document.getElementById('centerAudioBtn');
        centerText.classList.add('hidden');
        centerAudio.classList.add('hidden');

        // Sequential 1 -> 2 -> 3 -> 4 reveal with smoke puff & tuned chime arpeggio
        const delays = [0, 140, 280, 420];
        delays.forEach((delay, idx) => {
          const t = setTimeout(() => {
            const qEl = document.getElementById('q' + idx);
            qEl.innerHTML = SMOKE_SVG_HTML + '<div class="item-reveal-active" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">' + roundOptions[idx].svg + '</div>';
            audioSys.playRevealStep(idx + 1);
          }, delay);
          revealTimers.push(t);
        });

        // Sequence finish: show center word, unlock input, pronounce
        const finishT = setTimeout(() => {
          isLocked = false;
          if (effective === 1) {
            centerText.innerText = currentWord.word;
            centerText.classList.remove('hidden');
            centerText.classList.add('center-word-reveal');
          } else {
            centerAudio.classList.remove('hidden');
            centerAudio.classList.add('center-word-reveal');
          }
          audioSys.pronounce(currentWord);
        }, 580);
        revealTimers.push(finishT);

      } else if (effective === 2) {
        document.getElementById('stageMode2').classList.remove('hidden');
        document.getElementById('stageMode2').style.backgroundColor = currentColors[0];
        
        const artEl = document.getElementById('mode2Art');
        artEl.innerHTML = SMOKE_SVG_HTML;
        audioSys.playSmokePop();

        const t1 = setTimeout(() => {
          artEl.innerHTML = '<div class="item-reveal-active">' + currentWord.svg + '</div>';
        }, 70);

        const wordsEl = document.getElementById('mode2Words');
        wordsEl.innerHTML = roundOptions.map((opt, idx) => `
          <div id="m2w_${opt.id}" class="word-card" style="background-color: ${currentColors[idx]};" onclick="chooseWord('${opt.id}')">
            <span class="babadum-stroke-text">${opt.word}</span>
          </div>
        `).join('');

        const t2 = setTimeout(() => {
          isLocked = false;
          audioSys.pronounce(currentWord);
        }, 480);
        revealTimers.push(t1, t2);

      } else if (effective === 4) {
        document.getElementById('stageMode4').classList.remove('hidden');
        document.getElementById('stageMode4').style.backgroundColor = currentColors[0];

        const artEl = document.getElementById('mode4Art');
        artEl.innerHTML = SMOKE_SVG_HTML;
        audioSys.playSmokePop();

        const t1 = setTimeout(() => {
          artEl.innerHTML = '<div class="item-reveal-active">' + currentWord.svg + '</div>';
        }, 70);

        const letters = currentWord.word.toLowerCase().split('');
        const alphabet = 'abcdefghijklmnopqrstuvwxyz';
        const extra = [1, 2, 3].map(() => alphabet[Math.floor(Math.random() * alphabet.length)]);
        spellingTiles = [...letters.filter(c => c !== ' '), ...extra].sort(() => 0.5 - Math.random()).map((l, id) => ({ letter: l, used: false, id }));
        spellingSlots = letters.map(c => c === ' ' ? ' ' : null);

        renderMode4();

        const t2 = setTimeout(() => {
          isLocked = false;
          audioSys.pronounce(currentWord);
        }, 480);
        revealTimers.push(t1, t2);
      }
    }

    function renderMode4() {
      const slotsEl = document.getElementById('mode4Slots');
      slotsEl.innerHTML = spellingSlots.map((val, idx) => {
        if (val === ' ') return '<div style="width: 20px;"></div>';
        const filled = val !== null;
        return `
          <div class="letter-slot ${filled ? 'filled' : ''}" onclick="onSlotTap(${idx})">
            ${filled ? '<span class="babadum-stroke-text">' + val + '</span>' : ''}
          </div>
        `;
      }).join('');

      const trayEl = document.getElementById('mode4Tray');
      trayEl.innerHTML = spellingTiles.map((t, idx) => `
        <button class="letter-bubble ${t.used ? 'used' : ''}" onclick="onTileTap(${idx})">
          ${t.letter}
        </button>
      `).join('');
    }

    function onTileTap(idx) {
      if (isLocked) return;
      const tile = spellingTiles[idx];
      if (tile.used) return;
      const firstEmpty = spellingSlots.findIndex(s => s === null);
      if (firstEmpty === -1) return;
      audioSys.playPop(440 + firstEmpty * 35);
      spellingSlots[firstEmpty] = tile.letter;
      tile.used = true;
      renderMode4();

      if (!spellingSlots.includes(null)) {
        if (spellingSlots.join('') === currentWord.word.toLowerCase()) {
          handleSuccess();
        } else {
          handleFailure();
          setTimeout(() => {
            spellingSlots = currentWord.word.toLowerCase().split('').map(c => c === ' ' ? ' ' : null);
            spellingTiles.forEach(t => t.used = false);
            renderMode4();
          }, 600);
        }
      }
    }

    function onSlotTap(idx) {
      if (isLocked) return;
      const char = spellingSlots[idx];
      if (!char || char === ' ') return;
      audioSys.playPop(340);
      const tile = spellingTiles.find(t => t.letter === char && t.used);
      if (tile) tile.used = false;
      spellingSlots[idx] = null;
      renderMode4();
    }

    function chooseQuadrant(idx) {
      if (isLocked) return;
      if (roundOptions[idx].id === currentWord.id) {
        handleSuccess();
      } else {
        handleFailure();
      }
    }

    function chooseWord(id) {
      if (isLocked) return;
      if (id === currentWord.id) {
        handleSuccess();
      } else {
        const el = document.getElementById('m2w_' + id);
        if (el) el.classList.add('struck');
        handleFailure();
      }
    }

    function handleSuccess() {
      if (isLocked) return;
      isLocked = true;
      audioSys.playCorrect();
      showThumb('up');
      score++;
      document.getElementById('scoreCounter').innerText = score;
      setTimeout(loadQuestion, 700);
    }

    function handleFailure() {
      audioSys.playWrong();
      showThumb('down');
      score = Math.max(0, score - 1);
      document.getElementById('scoreCounter').innerText = score;
    }

    function showThumb(type) {
      hideThumbs();
      const el = document.getElementById(type === 'up' ? 'thumbUp' : 'thumbDown');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 650);
    }

    function hideThumbs() {
      document.getElementById('thumbUp').classList.remove('show');
      document.getElementById('thumbDown').classList.remove('show');
    }

    function openModal(type) {
      const b = document.getElementById('modalBackdrop');
      const title = document.getElementById('modalTitle');
      const content = document.getElementById('modalContent');
      b.classList.remove('hidden');

      if (type === 'explorer') {
        title.innerText = 'Word Explorer (500 Words)';
        content.innerHTML = `
          <input type="text" id="expSearch" placeholder="Search 500 words..." oninput="filterExplorer()" style="width: 100%; padding: 10px; border: 3px solid var(--ink); border-radius: 12px; font-weight: 700; margin-bottom: 12px;">
          <div id="expGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;"></div>
        `;
        filterExplorer();
      } else if (type === 'scores') {
        title.innerText = 'High Scores';
        content.innerHTML = '<div style="font-weight: 900; font-size: 1.4rem; text-align: center; padding: 24px;">Current Score: ' + score + '</div>';
      } else {
        title.innerText = 'Statistics';
        content.innerHTML = '<div style="font-weight: 900; font-size: 1.4rem; text-align: center; padding: 24px;">500 Vocabulary Words Active</div>';
      }
    }

    function filterExplorer() {
      const q = (document.getElementById('expSearch') ? document.getElementById('expSearch').value : '').toLowerCase();
      const grid = document.getElementById('expGrid');
      if (!grid) return;
      grid.innerHTML = VOCABULARY.filter(w => w.word.toLowerCase().includes(q)).map(w => `
        <div onclick="audioSys.playClick(); audioSys.pronounce(VOCABULARY.find(x => x.id === '${w.id}'))" style="background: #ffffff; border: 3px solid var(--ink); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; box-shadow: 0 3px 0 var(--ink);">
          <div style="width: 50px; height: 50px; margin-bottom: 6px;">${w.svg}</div>
          <div style="font-weight: 900; font-size: 0.85rem; text-align: center; text-transform: capitalize;">${w.word}</div>
        </div>
      `).join('');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    // Keyboard support for letter builder
    window.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if (/^[a-z]$/.test(key)) {
        const idx = spellingTiles.findIndex(t => t.letter === key && !t.used);
        if (idx !== -1) onTileTap(idx);
      }
    });

    init();
  </script>
</body>
</html>
